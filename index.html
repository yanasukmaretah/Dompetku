<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu - Aplikasi Keuangan Rumah Tangga</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 min-h-screen text-slate-100 font-sans pb-12">

  <!-- Header Banner -->
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-card p-5 rounded-3xl shadow-2xl mb-6 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <i data-lucide="wallet" class="w-7 h-7 text-amber-400"></i>
          <h1 class="text-2xl font-black bg-gradient-to-r from-amber-200 via-pink-300 to-purple-300 bg-clip-text text-transparent">
            DompetKu
          </h1>
        </div>
        <p class="text-xs text-slate-300 mt-1">Keuangan Rumah Tangga •</p>
      </div>
      <button onclick="openModal()" class="w-full sm:w-auto bg-gradient-to-r from-amber-400 to-pink-500 hover:from-amber-500 hover:to-pink-600 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Catat Transaksi
      </button>
    </header>

    <!-- Ringkasan Saldo Utama -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <!-- Card Belanja -->
      <div class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-blue-400 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Belanja & Dapur</span>
          <i data-lucide="shopping-bag" class="w-4 h-4 text-blue-400"></i>
        </div>
        <h3 id="totalBelanja" class="text-2xl font-bold text-blue-200">Rp 0</h3>
        <p class="text-[11px] text-slate-400 mt-2">Pengeluaran harian & rutin</p>
      </div>

      <!-- Card Tabungan -->
      <div class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-emerald-400 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Tabungan & Darurat</span>
          <i data-lucide="piggy-bank" class="w-4 h-4 text-emerald-400"></i>
        </div>
        <h3 id="totalTabungan" class="text-2xl font-bold text-emerald-200">Rp 0</h3>
        <p class="text-[11px] text-slate-400 mt-2">Simpanan cair & aman</p>
      </div>

      <!-- Card Saham -->
      <div class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-amber-400 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Investasi Saham</span>
          <i data-lucide="trending-up" class="w-4 h-4 text-amber-400"></i>
        </div>
        <h3 id="totalSaham" class="text-2xl font-bold text-amber-200">Rp 0</h3>
        <p class="text-[11px] text-slate-400 mt-2">Modal saham & portofolio</p>
      </div>
    </div>

    <!-- Layout Visual & Riwayat -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <!-- Graphic Chart -->
      <div class="glass-card-dark p-5 rounded-2xl md:col-span-1 flex flex-col justify-center items-center">
        <h4 class="text-sm font-semibold text-slate-300 mb-4 self-start flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-purple-400"></i> Rasio Alokasi
        </h4>
        <div class="w-full max-w-[200px]">
          <canvas id="allocationChart"></canvas>
        </div>
      </div>

      <!-- Daftar Transaksi Terakhir -->
      <div class="glass-card-dark p-5 rounded-2xl md:col-span-2">
        <div class="flex justify-between items-center mb-4">
          <h4 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
            <i data-lucide="list" class="w-4 h-4 text-pink-400"></i> Transaksi Terakhir
          </h4>
          <button onclick="clearAllData()" class="text-xs text-rose-400 hover:text-rose-300 transition">Hapus Semua</button>
        </div>
        <div class="space-y-3 max-h-[260px] overflow-y-auto pr-1" id="transactionList">
          <!-- Item transaksi dimuat dinamis -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Input Transaksi -->
  <div id="transactionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden justify-center items-center p-4 z-50">
    <div class="glass-card-dark w-full max-w-md p-6 rounded-3xl border border-white/10 shadow-2xl relative">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="edit-3" class="w-5 h-5 text-amber-400"></i> Catat Keuangan Baru
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="financeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Pos Keuangan</label>
          <select id="posCategory" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
            <option value="belanja">🛒 Belanja & Kebutuhan Dapur</option>
            <option value="tabungan">🐖 Tabungan / Dana Darurat</option>
            <option value="saham">📈 Modal Saham / RDN</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">Keterangan / Nama Barang / Kode Saham</label>
          <input type="text" id="description" required placeholder="misal: Belanja Sayur / Beli BBCA" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">Jumlah (Rp)</label>
          <input type="number" id="amount" required min="1" placeholder="50000" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">Tanggal</label>
          <input type="date" id="txDate" required class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <div class="pt-2 flex gap-3">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm hover:bg-slate-800 transition">Batal</button>
          <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-pink-500 text-slate-950 font-bold text-sm hover:opacity-90 transition">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('dompetku_data')) || [
      { id: 1, category: 'belanja', desc: 'Belanja Mingguan Dapur', amount: 350000, date: '2026-09-10' },
      { id: 2, category: 'tabungan', desc: 'Setor Dana Darurat', amount: 500000, date: '2026-09-12' },
      { id: 3, category: 'saham', desc: 'Beli Saham BBCA', amount: 400000, date: '2026-09-14' }
    ];

    let myChart = null;
    lucide.createIcons();
    document.getElementById('txDate').valueAsDate = new Date();

    function formatRupiah(num) {
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    function renderUI() {
      const listEl = document.getElementById('transactionList');
      listEl.innerHTML = '';

      let totalBelanja = 0, totalTabungan = 0, totalSaham = 0;

      if (transactions.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Belum ada catatan transaksi.</p>';
      } else {
        transactions.forEach(tx => {
          if (tx.category === 'belanja') totalBelanja += Number(tx.amount);
          if (tx.category === 'tabungan') totalTabungan += Number(tx.amount);
          if (tx.category === 'saham') totalSaham += Number(tx.amount);

          let badgeColor = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
          let catLabel = 'Belanja';
          if (tx.category === 'tabungan') { badgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'; catLabel = 'Tabungan'; }
          if (tx.category === 'saham') { badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30'; catLabel = 'Saham'; }

          const item = document.createElement('div');
          item.className = 'flex justify-between items-center p-3 rounded-xl bg-slate-900/60 border border-white/5 hover:border-white/10 transition';
          item.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="text-xs px-2.5 py-1 rounded-lg border ${badgeColor} font-medium">${catLabel}</span>
              <div>
                <p class="text-xs font-semibold text-slate-200">${tx.desc}</p>
                <p class="text-[10px] text-slate-400">${tx.date}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-slate-100">${formatRupiah(tx.amount)}</span>
              <button onclick="deleteTx(${tx.id})" class="text-slate-500 hover:text-rose-400 text-xs transition">&times;</button>
            </div>
          `;
          listEl.appendChild(item);
        });
      }

      document.getElementById('totalBelanja').innerText = formatRupiah(totalBelanja);
      document.getElementById('totalTabungan').innerText = formatRupiah(totalTabungan);
      document.getElementById('totalSaham').innerText = formatRupiah(totalSaham);

      updateChart(totalBelanja, totalTabungan, totalSaham);
    }

    function updateChart(belanja, tabungan, saham) {
      const ctx = document.getElementById('allocationChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Belanja', 'Tabungan', 'Saham'],
          datasets: [{
            data: [belanja, tabungan, saham],
            backgroundColor: ['#60a5fa', '#34d399', '#fbbf24'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          cutout: '70%'
        }
      });
    }

    function openModal() {
      document.getElementById('transactionModal').classList.remove('hidden');
      document.getElementById('transactionModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('transactionModal').classList.add('hidden');
      document.getElementById('transactionModal').classList.remove('flex');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const category = document.getElementById('posCategory').value;
      const desc = document.getElementById('description').value;
      const amount = document.getElementById('amount').value;
      const date = document.getElementById('txDate').value;

      transactions.unshift({ id: Date.now(), category, desc, amount: Number(amount), date });
      localStorage.setItem('dompetku_data', JSON.stringify(transactions));
      renderUI();
      closeModal();
      document.getElementById('financeForm').reset();
      document.getElementById('txDate').valueAsDate = new Date();
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('dompetku_data', JSON.stringify(transactions));
      renderUI();
    }

    function clearAllData() {
      if (confirm('Hapus seluruh catatan?')) {
        transactions = [];
        localStorage.removeItem('dompetku_data');
        renderUI();
      }
    }

    renderUI();
  </script>
</body>
</html>
