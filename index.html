<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu - Aplikasi Keuangan Emak</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 min-h-screen text-slate-100 font-sans pb-12">

  <!-- Header Banner -->
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-card p-5 rounded-3xl shadow-2xl mb-6 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <i data-lucide="wallet" class="w-7 h-7 text-amber-400"></i>
          <h1 class="text-2xl font-black bg-gradient-to-r from-amber-200 via-pink-300 to-purple-300 bg-clip-text text-transparent">
            DompetKu
          </h1>
        </div>
      </div>
      <button onclick="openInputModal()" class="w-full sm:w-auto bg-gradient-to-r from-amber-400 to-pink-500 hover:from-amber-500 hover:to-pink-600 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Catat Transaksi
      </button>
    </header>

    <!-- Total Sisa Saldo / Cashflow Banner -->
    <div class="glass-card-dark p-5 rounded-2xl mb-6 flex flex-col sm:flex-row justify-between items-center border border-amber-500/30">
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sisa Saldo Kas Utama</span>
        <h2 id="totalSaldo" class="text-3xl font-black text-amber-300 mt-1">Rp 0</h2>
      </div>
      <div class="flex gap-4 mt-3 sm:mt-0 text-xs">
        <div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-2 rounded-xl">
          <span class="text-slate-400 block">Total In</span>
          <span id="totalIn" class="font-bold text-emerald-400">Rp 0</span>
        </div>
        <div class="bg-rose-500/10 border border-rose-500/20 px-3 py-2 rounded-xl">
          <span class="text-slate-400 block">Total Out</span>
          <span id="totalOut" class="font-bold text-rose-400">Rp 0</span>
        </div>
      </div>
    </div>

    <!-- Ringkasan Alokasi Pos Utama (Klik untuk memfilter daftar transaksi) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <!-- Card Belanja -->
      <div onclick="setFilter('belanja')" class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-blue-400 shadow-lg cursor-pointer hover:bg-slate-800/80 transition transform hover:-translate-y-1">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Belanja & Dapur</span>
          <i data-lucide="shopping-bag" class="w-4 h-4 text-blue-400"></i>
        </div>
        <h3 id="totalBelanja" class="text-2xl font-bold text-blue-200">Rp 0</h3>
        <p class="text-[11px] text-amber-300 mt-2 font-medium flex items-center gap-1">Tampilkan Rincian Pos ➔</p>
      </div>

      <!-- Card Tabungan -->
      <div onclick="setFilter('tabungan')" class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-emerald-400 shadow-lg cursor-pointer hover:bg-slate-800/80 transition transform hover:-translate-y-1">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Tabungan</span>
          <i data-lucide="piggy-bank" class="w-4 h-4 text-emerald-400"></i>
        </div>
        <h3 id="totalTabungan" class="text-2xl font-bold text-emerald-200">Rp 0</h3>
        <p class="text-[11px] text-amber-300 mt-2 font-medium flex items-center gap-1">Tampilkan Rincian Pos ➔</p>
      </div>

      <!-- Card Saham -->
      <div onclick="setFilter('saham')" class="glass-card-dark p-5 rounded-2xl border-l-4 border-l-amber-400 shadow-lg cursor-pointer hover:bg-slate-800/80 transition transform hover:-translate-y-1">
        <div class="flex justify-between items-center text-slate-400 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">Investasi</span>
          <i data-lucide="trending-up" class="w-4 h-4 text-amber-400"></i>
        </div>
        <h3 id="totalSaham" class="text-2xl font-bold text-amber-200">Rp 0</h3>
        <p class="text-[11px] text-amber-300 mt-2 font-medium flex items-center gap-1">Tampilkan Rincian Pos ➔</p>
      </div>
    </div>

    <!-- Layout Visual & Riwayat Transaksi -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="glass-card-dark p-5 rounded-2xl md:col-span-1 flex flex-col justify-center items-center">
        <h4 class="text-sm font-semibold text-slate-300 mb-4 self-start flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-purple-400"></i> Rasio Pengeluaran
        </h4>
        <div class="w-full max-w-[200px]">
          <canvas id="allocationChart"></canvas>
        </div>
      </div>

      <div class="glass-card-dark p-5 rounded-2xl md:col-span-2">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <h4 id="listHeaderTitle" class="text-sm font-semibold text-slate-300 flex items-center gap-2">
              <i data-lucide="list" class="w-4 h-4 text-pink-400"></i> Semua Transaksi Terakhir
            </h4>
            <button id="resetFilterBtn" onclick="setFilter('all')" class="hidden text-[11px] bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border border-amber-500/40 px-2.5 py-0.5 rounded-full transition flex items-center gap-1">
              <span>Semua</span> &times;
            </button>
          </div>
          <button onclick="clearAllData()" class="text-xs text-rose-400 hover:text-rose-300 transition">Hapus Semua</button>
        </div>
        <div class="space-y-3 max-h-[280px] overflow-y-auto pr-1" id="transactionList">
          <!-- Item transaksi dimuat dinamis -->
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL POP-UP: Input Transaksi Baru -->
  <div id="transactionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden justify-center items-center p-4 z-50">
    <div class="glass-card-dark w-full max-w-md p-6 rounded-3xl border border-amber-500/20 shadow-2xl relative">
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-white/10">
        <h3 class="text-lg font-bold bg-gradient-to-r from-amber-200 to-pink-300 bg-clip-text text-transparent flex items-center gap-2">
          <i data-lucide="edit-3" class="w-5 h-5 text-amber-400"></i> Catat Keuangan Baru
        </h3>
        <button onclick="closeInputModal()" class="w-8 h-8 rounded-full bg-slate-800/80 text-slate-400 hover:text-amber-300 flex items-center justify-center transition">&times;</button>
      </div>

      <form id="financeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Jenis Transaksi</label>
          <select id="txType" class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
            <option value="in" class="bg-slate-900 text-emerald-400">🟢 Pemasukan</option>
            <option value="out" class="bg-slate-900 text-rose-400">🔴 Pengeluaran</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Pos Keuangan</label>
          <select id="posCategory" class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
            <option value="belanja" class="bg-slate-900">🛒 Belanja & Kebutuhan Dapur</option>
            <option value="tabungan" class="bg-slate-900">🐖 Tabungan</option>
            <option value="saham" class="bg-slate-900">📈 Investasi</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Detail</label>
          <input type="text" id="description" required placeholder="misal: Uang Harian / Belanja Sayur / Beli Saham" class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Jumlah (Rp)</label>
          <input type="number" id="amount" required min="1" placeholder="50000" class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Tanggal</label>
          <input type="date" id="txDate" required class="w-full bg-slate-900/90 border border-purple-500/30 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
        </div>

        <div class="pt-3 flex gap-3">
          <button type="button" onclick="closeInputModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 font-semibold text-sm hover:bg-slate-800/80 transition">Batal</button>
          <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-pink-500 hover:from-amber-500 hover:to-pink-600 text-slate-950 font-bold text-sm shadow-lg transition">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('dompetku_data')) || [];
    let currentFilter = 'all'; // Status filter aktif
    let myChart = null;

    lucide.createIcons();
    document.getElementById('txDate').valueAsDate = new Date();

    function formatRupiah(num) {
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    function setFilter(category) {
      currentFilter = category;
      renderUI();
    }

    function renderUI() {
      const listEl = document.getElementById('transactionList');
      const resetBtn = document.getElementById('resetFilterBtn');
      const headerTitle = document.getElementById('listHeaderTitle');
      listEl.innerHTML = '';

      let totalBelanja = 0, totalTabungan = 0, totalSaham = 0;
      let totalIn = 0, totalOut = 0;

      // Hitung akumulasi angka banner
      transactions.forEach(tx => {
        const isIncome = tx.type === 'in';
        const amt = Number(tx.amount);

        if (isIncome) totalIn += amt;
        else totalOut += amt;

        if (tx.category === 'belanja') totalBelanja += isIncome ? amt : -amt;
        if (tx.category === 'tabungan') totalTabungan += isIncome ? amt : -amt;
        if (tx.category === 'saham') totalSaham += isIncome ? amt : -amt;
      });

      // Filter daftar transaksi berdasarkan kartu yang diklik
      const filteredTransactions = currentFilter === 'all' 
        ? transactions 
        : transactions.filter(t => t.category === currentFilter);

      // Pembaruan Judul & Tombol Reset
      if (currentFilter === 'all') {
        resetBtn.classList.add('hidden');
        headerTitle.innerHTML = `<i data-lucide="list" class="w-4 h-4 text-pink-400"></i> Semua Transaksi Terakhir`;
      } else {
        resetBtn.classList.remove('hidden');
        let catText = currentFilter === 'belanja' ? 'Belanja & Dapur' : (currentFilter === 'tabungan' ? 'Tabungan' : 'Investasi');
        headerTitle.innerHTML = `<i data-lucide="filter" class="w-4 h-4 text-amber-400"></i> Rincian Pos: ${catText}`;
      }
      lucide.createIcons();

      // Render daftar item
      if (filteredTransactions.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Belum ada catatan ${currentFilter === 'all' ? 'transaksi' : 'di pos ini'}.</p>`;
      } else {
        filteredTransactions.forEach(tx => {
          const isIncome = tx.type === 'in';

          let typeBadge = isIncome 
            ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">IN</span>' 
            : '<span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 font-bold border border-rose-500/30">OUT</span>';

          let badgeColor = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
          let catLabel = 'Belanja';
          if (tx.category === 'tabungan') { badgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'; catLabel = 'Tabungan'; }
          if (tx.category === 'saham') { badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30'; catLabel = 'Saham'; }

          const item = document.createElement('div');
          item.className = 'flex justify-between items-center p-3 rounded-xl bg-slate-900/60 border border-white/5 hover:border-white/10 transition';
          item.innerHTML = `
            <div class="flex items-center gap-3">
              ${typeBadge}
              <span class="text-[11px] px-2 py-0.5 rounded-lg border ${badgeColor} font-medium">${catLabel}</span>
              <div>
                <p class="text-xs font-semibold text-slate-200">${tx.desc}</p>
                <p class="text-[10px] text-slate-400">${tx.date}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold ${isIncome ? 'text-emerald-400' : 'text-slate-100'}">
                ${isIncome ? '+' : '-'} ${formatRupiah(tx.amount)}
              </span>
              <button onclick="deleteTx(${tx.id})" class="text-slate-500 hover:text-rose-400 text-xs transition">&times;</button>
            </div>
          `;
          listEl.appendChild(item);
        });
      }

      // Update Angka Banner
      document.getElementById('totalSaldo').innerText = formatRupiah(totalIn - totalOut);
      document.getElementById('totalIn').innerText = formatRupiah(totalIn);
      document.getElementById('totalOut').innerText = formatRupiah(totalOut);

      document.getElementById('totalBelanja').innerText = formatRupiah(totalBelanja);
      document.getElementById('totalTabungan').innerText = formatRupiah(totalTabungan);
      document.getElementById('totalSaham').innerText = formatRupiah(totalSaham);

      updateChart(Math.max(0, totalBelanja), Math.max(0, totalTabungan), Math.max(0, totalSaham));
    }

    function updateChart(belanja, tabungan, saham) {
      const ctx = document.getElementById('allocationChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Belanja', 'Tabungan', 'Saham'],
          datasets: [{
            data: [belanja, tabungan, saham],
            backgroundColor: ['#60a5fa', '#34d399', '#fbbf24'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          cutout: '70%'
        }
      });
    }

    function openInputModal() {
      document.getElementById('transactionModal').classList.remove('hidden');
      document.getElementById('transactionModal').classList.add('flex');
    }

    function closeInputModal() {
      document.getElementById('transactionModal').classList.add('hidden');
      document.getElementById('transactionModal').classList.remove('flex');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('txType').value;
      const category = document.getElementById('posCategory').value;
      const desc = document.getElementById('description').value;
      const amount = document.getElementById('amount').value;
      const date = document.getElementById('txDate').value;

      transactions.unshift({ id: Date.now(), type, category, desc, amount: Number(amount), date });
      localStorage.setItem('dompetku_data', JSON.stringify(transactions));
      renderUI();
      closeInputModal();
      document.getElementById('financeForm').reset();
      document.getElementById('txDate').valueAsDate = new Date();
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('dompetku_data', JSON.stringify(transactions));
      renderUI();
    }

    function clearAllData() {
      if (confirm('Hapus seluruh catatan?')) {
        transactions = [];
        localStorage.setItem('dompetku_data', JSON.stringify([]));
        renderUI();
      }
    }

    renderUI();
  </script>
</body>
</html>
